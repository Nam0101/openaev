name: Docker Build & Push
description: >
  Build a multi-arch Docker image and push to a container registry.
  In dry-run mode, runs extended validation (image size, JAR presence,
  Java version, multi-arch manifest) after pushing.
  The calling job MUST run actions/checkout before this action.

inputs:
  dry-run:
    description: >
      When 'true', runs extended image validation after pushing.
    required: false
    default: 'false'
  registry:
    description: >
      Container registry (e.g. 'ghcr.io'). Leave empty for Docker Hub.
    required: false
    default: ''
  registry-username:
    description: Registry username
    required: true
  registry-password:
    description: Registry password or token
    required: true
  tags:
    description: >
      Docker image tags (newline or comma-separated).
      Passed directly to docker/build-push-action.
    required: true
  labels:
    description: Docker image labels (from docker/metadata-action)
    required: false
    default: ''

outputs:
  digest:
    description: Docker image digest
    value: ${{ steps.docker-build.outputs.digest }}
  image_size_mb:
    description: Docker image size in MB (dry-run only)
    value: ${{ steps.docker-validate.outputs.image_size_mb }}
  image_warning:
    description: Whether image size is suspiciously small (dry-run only)
    value: ${{ steps.docker-validate.outputs.image_warning }}
  jar_in_image:
    description: Whether openaev-api.jar was found inside the image (dry-run only)
    value: ${{ steps.docker-validate.outputs.jar_in_image }}
  java_version:
    description: Java version inside the image (dry-run only)
    value: ${{ steps.docker-validate.outputs.java_version }}
  layer_count:
    description: Number of image layers (dry-run only)
    value: ${{ steps.docker-validate.outputs.layer_count }}

runs:
  using: composite
  steps:
    - name: Download backend JAR artifact
      uses: actions/download-artifact@v8
      with:
        name: openaev-api-jar
        path: openaev-build

    - name: Verify backend JAR
      run: |
        if [ ! -f "openaev-build/openaev-api.jar" ]; then
          echo "❌ openaev-api.jar not found in openaev-build/"
          ls -la openaev-build/ 2>/dev/null || echo "  directory does not exist"
          exit 1
        fi
        JAR_SIZE=$(stat --format=%s openaev-build/openaev-api.jar 2>/dev/null || stat -f%z openaev-build/openaev-api.jar 2>/dev/null)
        if [ "$JAR_SIZE" -lt 1000 ] 2>/dev/null; then
          echo "❌ openaev-api.jar is suspiciously small ($JAR_SIZE bytes)"
          exit 1
        fi
        echo "✅ openaev-api.jar present for Docker build ($JAR_SIZE bytes)"
      shell: bash

    - name: Set up QEMU (multi-arch emulation)
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Build and push
      id: docker-build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile_ga
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}

    - name: Validate Docker image (dry-run)
      id: docker-validate
      if: ${{ inputs.dry-run == 'true' }}
      run: |
        # Extract the first tag for validation
        IMAGE=$(echo "${{ inputs.tags }}" | tr ',' '\n' | head -1 | xargs)

        # Pull the amd64 image for inspection
        docker pull --platform linux/amd64 "$IMAGE"

        # Check image size
        IMAGE_SIZE=$(docker image inspect "$IMAGE" --format='{{.Size}}')
        IMAGE_SIZE_MB=$(awk "BEGIN {printf \"%.1f\", $IMAGE_SIZE / 1048576}")
        echo "image_size=$IMAGE_SIZE"       >> "$GITHUB_OUTPUT"
        echo "image_size_mb=$IMAGE_SIZE_MB" >> "$GITHUB_OUTPUT"
        echo "  Image size: ${IMAGE_SIZE_MB} MB"

        # Image should be at least 200 MB (JRE + app)
        if [ "$IMAGE_SIZE" -lt 209715200 ]; then
          echo "⚠️ Docker image is only ${IMAGE_SIZE_MB} MB — suspiciously small"
          echo "image_warning=true" >> "$GITHUB_OUTPUT"
        else
          echo "✅ Docker image size looks healthy"
          echo "image_warning=false" >> "$GITHUB_OUTPUT"
        fi

        # Verify JAR is inside the image
        JAR_IN_IMAGE=$(docker run --rm --entrypoint ls "$IMAGE" -la /opt/openaev-api.jar 2>/dev/null || echo "MISSING")
        if echo "$JAR_IN_IMAGE" | grep -q "MISSING"; then
          echo "❌ openaev-api.jar NOT found inside Docker image!"
          echo "jar_in_image=false" >> "$GITHUB_OUTPUT"
        else
          echo "✅ openaev-api.jar found inside Docker image"
          echo "jar_in_image=true" >> "$GITHUB_OUTPUT"
        fi

        # Verify Java is available
        JAVA_VERSION=$(docker run --rm --entrypoint java "$IMAGE" -version 2>&1 | head -1 || echo "MISSING")
        echo "  Java: $JAVA_VERSION"
        echo "java_version=$JAVA_VERSION" >> "$GITHUB_OUTPUT"

        # Check multi-arch manifest
        echo ""
        echo "── Multi-arch manifest ──"
        docker manifest inspect "$IMAGE" 2>/dev/null \
          | jq -r '.manifests[] | "  \(.platform.os)/\(.platform.architecture)"' \
          || echo "  (manifest inspect not available)"

        # Count layers
        LAYER_COUNT=$(docker image inspect "$IMAGE" --format='{{len .RootFS.Layers}}')
        echo "  Layers: $LAYER_COUNT"
        echo "layer_count=$LAYER_COUNT" >> "$GITHUB_OUTPUT"
      shell: bash

